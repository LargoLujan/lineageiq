services:
  lineageiq:
    build:
      context: .
      dockerfile: Dockerfile
    image: lineageiq:local
    container_name: lineageiq
    working_dir: /workspace
    entrypoint: ["/workspace/docker/entrypoint.sh"]
    volumes:
      - ./:/workspace
      - fabric_mapper_azure:/root/.azure
      - fabric_mapper_fabric:/root/.fabric
    environment:
      FABRIC_MAPPER_MODE: read_only
      LINEAGE_WEB_AUTOSTART: "true"
      LINEAGE_WEB_ROOT: /workspace/frontend/semantic-lineage
      LINEAGE_WEB_PORT: "8765"
      LINEAGE_WEB_HOST: "0.0.0.0"
      LINEAGE_WEB_PUBLIC_TUNNEL: "false"
      LINEAGE_WEB_TUNNEL_WAIT_SECONDS: "120"
    ports:
      - "8765:8765"
    stdin_open: true
    tty: true

volumes:
  fabric_mapper_azure:
  fabric_mapper_fabric:
