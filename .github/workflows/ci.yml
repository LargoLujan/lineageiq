name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    name: Python compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt
          pip install -r requirements-mcp.txt
          pip install pytest
      - name: Compile every Python file (syntax check)
        run: python -m compileall -q backend/scripts fabric_notebooks tests
      - name: Run unit tests
        run: python -m pytest tests/python/ -q

  js-syntax:
    name: JavaScript syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check every tracked .js file parses
        run: |
          set -e
          git ls-files "*.js" | grep -v "/vendor/" | while read -r f; do
            echo "Checking $f"
            node --check "$f"
          done

  leak-scan:
    name: Leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Optional leak guard
        env:
          LEAK_SCAN_PATTERN: ${{ secrets.LEAK_SCAN_PATTERN }}
        run: |
          set -e
          # Set the LEAK_SCAN_PATTERN repository secret to a regex of tokens that
          # must never appear in tracked files. Without it, this step is skipped.
          if [ -z "$LEAK_SCAN_PATTERN" ]; then echo "LEAK_SCAN_PATTERN not set, skipping."; exit 0; fi
          MATCHES=$(git grep -rniE "$LEAK_SCAN_PATTERN" -- '*.py' '*.js' '*.ps1' '*.md' '*.json' '*.sql' '*.yml' '*.yaml' || true)
          if [ -n "$MATCHES" ]; then
            echo "::error::Tracked files match LEAK_SCAN_PATTERN:"
            echo "$MATCHES"
            exit 1
          fi
          echo "Clean: no matches."
